<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 · Faented</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #5eead4;
    --text: rgba(255, 255, 255, 0.85);
    --dim: rgba(255, 255, 255, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font: 14px/1.7 "JetBrains Mono", ui-monospace, Consolas, monospace;
    color: var(--text);
  }
  .window {
    width: 100%;
    max-width: 640px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.03);
    animation: appear 0.4s ease-out both;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.6);
  }
  .body { padding: 20px 24px; }
  .user { color: var(--accent); }
  .dim { color: var(--dim); }
  .err { color: #f87171; word-break: break-all; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  .cursor { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes appear { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    .window, .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="window">
    <div class="bar"><span>faented@404:~</span><a href="/" aria-label="Home">[x]</a></div>
    <div class="body">
      <div><span class="user">faented@404</span><span class="dim">:~$ </span>cd <span id="path">/</span></div>
      <div class="err">bash: cd: <span id="path2">/</span>: No such file or directory</div>
      <div><span class="user">faented@404</span><span class="dim">:~$ </span>echo $?</div>
      <div>404</div>
      <br />
      <div class="dim">нажми любую клавишу или <a href="/">[cd ~]</a>, чтобы вернуться домой</div>
      <div><span class="user">faented@404</span><span class="dim">:~$ </span><span class="cursor">█</span></div>
    </div>
  </main>
  <script>
    // показываем путь, который человек пытался открыть
    var p = location.pathname;
    try { p = decodeURIComponent(p); } catch (e) {}
    document.getElementById("path").textContent = p;
    document.getElementById("path2").textContent = p;
    addEventListener("keydown", function () { location.href = "/"; });
  </script>
</body>
</html>

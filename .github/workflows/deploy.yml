name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# сборка кладётся в ветку gh-pages — Pages настроен публиковать её
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # полная история: IndexNow сравнивает записки с прошлым пушем
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -t \
            -m "Deploy ${GITHUB_SHA::7}" \
            -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
      # сообщаем Bing (→ DuckDuckGo), Яндексу и др., что страницы обновились. Сбой здесь не роняет деплой
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        timeout-minutes: 12
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs

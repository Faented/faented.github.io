<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- подтверждение владения сайтом в Google Search Console и Bing Webmaster Tools — не удалять -->
<meta name="google-site-verification" content="EgP2Tq13RPaw3yVP8_baxnrQhyM5i2QwYxwmo7UNWoY" />
<meta name="msvalidate.01" content="ECB0A0955FBF9B17CCCDE7B11704A349" />
<!-- title, description, canonical, Open Graph и JSON-LD генерирует build/site.ts из src/config.ts -->
<!--seo:head-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.github.com" crossorigin />
<link rel="preconnect" href="https://avatars.githubusercontent.com" />
<meta name="theme-color" content="#000000" />
<style>
  html {
    background: #000;
  }
  /* текстовая версия главной для роботов без JS. React заменяет её при запуске;
     человеку она покажется, только если JS не загрузился за 3 секунды */
  .seo-fallback {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 16px;
    font: 14px/1.7 ui-monospace, Consolas, monospace;
    color: rgba(255, 255, 255, 0.8);
    opacity: 0;
    animation: seo-show 0.3s 3s forwards;
  }
  .seo-fallback a { color: #5eead4; }
  .seo-fallback ul { list-style: none; padding: 0; }
  .seo-fallback li { display: flex; gap: 16px; }
  @keyframes seo-show { to { opacity: 1; } }
</style>
<!-- шрифты не блокируют первую отрисовку: страница сразу рисуется системным шрифтом, потом подменяется -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;600&display=swap" /></noscript>
</head>
<body>
<div id="root"><!--seo:fallback--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
